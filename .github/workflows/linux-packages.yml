name: Linux packages

# Runs after cargo-dist finishes creating the GitHub Release, like the
# Homebrew tap job: cargo-dist owns release.yml and regenerates it, so the
# packaging cannot live there.
#
# This job does not rebuild anything. It repackages the linux-gnu binaries
# cargo-dist already built and published, so the bytes in the .deb are the
# same bytes users get from the tarball and the shell installer.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package (e.g. v0.0.55). Resolved from workflow_run when omitted."
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: resolve
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          SHA="${RELEASE_SHA:-}"
          if [ -z "$SHA" ]; then
            SHA=$(git rev-parse HEAD)
          fi

          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG=$(git describe --tags --exact-match "$SHA" 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              TAG="$RUN_HEAD_BRANCH"
            fi
          fi
          TAG=${TAG#refs/tags/}

          if [ -z "$TAG" ] || ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "No release tag found for $SHA; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag: $TAG at $SHA"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned deliberately and hash-checked, so a replaced upstream asset
      # fails the job rather than building the packages with an unverified
      # tool.
      - name: Install nfpm
        if: steps.resolve.outputs.proceed == 'true'
        env:
          NFPM_VERSION: 2.47.0
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        run: |
          set -eu
          url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o /tmp/nfpm.tar.gz "$url"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m755 /tmp/nfpm /usr/local/bin/nfpm

      - name: Build the packages
        if: steps.resolve.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist

          # The manifest version is the source of truth for the package
          # version, and the tag must agree with it. A mismatch means the tag
          # was pushed against an unbumped manifest, which would silently
          # publish a package whose version does not match the release.
          version="$(awk -F'"' '/^version/ { print $2; exit }' calepin/Cargo.toml)"
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::tag $TAG does not match calepin/Cargo.toml version $version"
            exit 1
          fi

          for pair in "x86_64-unknown-linux-gnu amd64" "aarch64-unknown-linux-gnu arm64"; do
            set -- $pair
            triple="$1"; arch="$2"
            asset="calepin-${triple}.tar.xz"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir /tmp --clobber
            rm -rf "/tmp/unpack-${arch}"
            mkdir -p "/tmp/unpack-${arch}"
            tar -xJf "/tmp/${asset}" -C "/tmp/unpack-${arch}" --strip-components=1
            ./scripts/make-linux-packages.sh "/tmp/unpack-${arch}/calepin" "$arch"
          done

          cd dist
          for artifact in *.deb *.rpm *.pkg.tar.zst; do
            sha256sum "$artifact" > "$artifact.sha256"
          done
          ls -l

      # Proves the package is installable and that the installed binary runs.
      # amd64 only: the runner cannot execute the arm64 binary.
      - name: Install the .deb and run it
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ./dist/calepin_*_amd64.deb
          calepin --version
          test -f /usr/share/doc/calepin/LICENSE
          sudo apt-get remove -y calepin

      - name: Attach to the release
        if: steps.resolve.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -eu
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.deb dist/*.deb.sha256 \
            dist/*.rpm dist/*.rpm.sha256 \
            dist/*.pkg.tar.zst dist/*.pkg.tar.zst.sha256

      # Tells the apt repo to rebuild now rather than waiting for its cron.
      # Optional: without a PAT in APT_REPO_TOKEN the packages are still
      # published, and the nightly cron picks them up within a day.
      - name: Nudge the apt repo
        if: steps.resolve.outputs.proceed == 'true'
        continue-on-error: true
        env:
          APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: |
          set -eu
          if [ -z "${APT_REPO_TOKEN:-}" ]; then
            echo "APT_REPO_TOKEN not set; the apt repo will pick this up on its next cron run."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${APT_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vincentarelbundock/apt/dispatches \
            -d '{"event_type":"upstream-release"}'
