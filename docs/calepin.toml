title = "Calepin"
description = "A Typst-native computational notebook and static website generator."
base_url = "https://vincentarelbundock.github.io/calepin"
logo = "assets/logo_short.svg"
logo_alt = "Calepin"
pdf = true
minify = false
search = "pagefind"
highlight-light = "assets/Catppuccin Latte.tmTheme"
highlight-dark = "assets/Catppuccin Mocha.tmTheme"
generate_feeds = true

[executables]
python = "../.venv/bin/python"
typst = "typst"

[feeds]
filenames = ["atom.xml", "rss.xml"]

[static]
include = ["assets/**", "index.typ", "themes/examples/tufte/**"]

[pages]
include = ["blog/*.typ"]
exclude = ["themes/examples/**", "slides/examples/**"]

[menus]

  [[menus.main]]
  target = "getting-started/install.typ"
  label = "Documentation"

  [[menus.social]]
  target = "https://github.com/vincentarelbundock/calepin"
  label = "{icon:github}"
  aria-label = "GitHub"

[footer]

  [[footer.item]]
  label = "© 2026 Vincent Arel-Bundock"

  [[footer.item]]
  label = "Made with Calepin."
  target = "https://vincentarelbundock.github.io/calepin"


