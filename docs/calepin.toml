title = "Calepin"
description = "A Typst-native computational notebook and static website generator."
base_url = "https://vincentarelbundock.github.io/calepin"
logo = "assets/logo_short_2.svg"
logo_alt = "Calepin"
pdf = true

[navbar]

[[navbar.item]]
position = "right"
target = "https://github.com/vincentarelbundock/calepin"
label = "{icon:github} GitHub"

[[navbar.item]]
position = "right"
widget = "theme"

[[navbar.item]]
position = "right"
widget = "language"

[executables]
python = "../.venv/bin/python"
typst = "typst"

