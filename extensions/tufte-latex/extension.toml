name = "tufte-latex"
description = "Tufte-style handouts and books using LaTeX and Typst"
version = "0.1.0"
license = "MIT"
inherits = "latex"

[targets.tufte-typst]
inherits = "typst"

[targets.tufte-pdf-latex]
inherits = "latex"
extension = "pdf"
post = ["pdflatex -interaction=nonstopmode -output-directory={root} {input}"]

[targets.tufte-pdf-typst]
inherits = "typst"
extension = "pdf"
post = ["typst compile {input}"]
