name = "letter"
description = "Professional letter template for Typst (based on letterloom by nandac)"
version = "0.1.0"
license = "Unlicense"
inherits = "typst"

[scaffold.document]
kind = "document"
description = "Professional letter"

[targets.letter-pdf-typst]
inherits = "letter"
extension = "pdf"
post = ["typst compile {input}"]
