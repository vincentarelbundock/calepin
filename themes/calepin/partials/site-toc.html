        {% if site.toc %}
        <aside class="calepin-website-toc">
            <p class="calepin-website-toc-title">On this page</p>
            <nav aria-label="On this page">
                <ul>
                    {% for item in site.toc %}
                    <li class="level-{{ item.level }}"><a href="{{ item.href }}">{{ item.label }}</a></li>
                    {% endfor %}
                </ul>
            </nav>
        </aside>
        {% endif %}
