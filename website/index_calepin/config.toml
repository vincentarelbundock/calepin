target = "website"
colors = ["nord", "ayu", "black", "catppuccin-frappe", "catppuccin-macchiato", "catppuccin-mocha"]

# -- Site identity --
title = "Calepin"
url = "https://vincentarelbundock.github.io/calepin"

# -- Rendering --
csl = "chicago-author-date"
math = "katex"
lang = "en"
standalone = true
dpi = 150.0


[figure]
fig_width = 6.0
fig_asp = 0.618
out_width = 0.70
device = "png"
alignment = "center"

[execute]
cache = true
eval = true
echo = true
include = true
warning = true
message = true
error = true
comment = "> "
results = "markup"

[toc]
enabled = true
depth = 3
title = "Contents"

[video]
width = "100%"
height = "400"
title = "Video"

[placeholder]
width = "600"
height = "400"
color = "#cccccc"

[lipsum]
paragraphs = 1

[layout]
valign = "top"
columns = 1
rows = 1

# -- Document targets --
[targets.html]
writer = "html"
template = "main"
extension = "html"
fig_extension = "svg"
fig_formats = ["svg", "png", "jpg", "webp", "gif"]
preview = "serve"
modules = ["highlight", "append_footnotes", "embed_images"]
crossref = "html"

[targets.latex]
writer = "latex"
template = "main"
extension = "tex"
fig_extension = "pdf"
fig_formats = ["pdf", "eps", "svg", "png", "jpg"]
preview = "serve"
modules = ["highlight", "convert_svg_pdf"]
crossref = "latex"
toc_headings = false

[targets.typst]
writer = "typst"
template = "main"
extension = "typ"
fig_extension = "svg"
fig_formats = ["svg", "png", "jpg"]
preview = "serve"
modules = ["highlight"]
crossref = "plain"

[targets.markdown]
writer = "markdown"
extension = "md"
fig_extension = "png"
preview = "none"
modules = ["highlight"]
crossref = "plain"

# -- Navbar --
[[navbar.left]]
image = "assets/Calepin.svg"
image_dark = "invert"
href = "index.qmd"
width = "104px"
height = "36px"

[[navbar.middle]]
text = "Docs"
href = "pages/installation.qmd"

[[navbar.right]]
icon = "assets/fontawesome/brands/github.svg"
href = "https://github.com/vincentarelbundock/calepin"
width = "20px"
height = "20px"

[[navbar.right]]
widget = "source"

[[navbar.right]]
widget = "search"

[[navbar.right]]
widget = "dark"

[[navbar.right]]
widget = "colors"

# -- Contents (sidebar navigation) --
[[contents]]
include = ["pages/inst*tion.qmd", "pages/*started.qmd", "pages/quarto.qmd"]

[[contents]]
text = "Authoring"
include = "authoring"

[[contents]]
text = "Code"
include = [
  "code/code_execution.qmd",
  "code/chunks.qmd",
  "code/inline.qmd",
  "code/r.qmd",
  "code/python.qmd",
  "code/sh.qmd",
  "code/diagrams.qmd",
  "code/cache.qmd",
  "code/builtins.qmd",
]

[[contents]]
text = "Templates"
include = [
  "templates/templates.qmd",
  "templates/snippets.qmd",
  "templates/reference.qmd",
]

[[contents]]
text = "Configuration"
include = "configuration"

[[contents]]
text = "Websites & Docs"
include = ["websites/structure.qmd", "websites/navigation.qmd", "websites/tailwind.qmd", "websites/serve.qmd", "websites/man.qmd"]

[[contents]]
text = "Extensions"
include = ["extensions/themes.qmd", "extensions/plugins.qmd"]

# -- Post-processing --
[[post]]
command = "pagefind --site {output} --glob '**/*.html'"
