[package]
name = "calepin"
version = "0.0.36"
edition = "2021"
description = "A Rust CLI for preprocessing Typst documents with executable code chunks"
license = "MIT"
repository = "https://github.com/vincentarelbundock/calepin"
homepage = "https://vincentarelbundock.github.io/calepin"
exclude = []

# Release build with debug symbols, for profiling with samply/flamegraph.
# Build with: cargo build --profile profiling --manifest-path calepin/Cargo.toml
[profile.profiling]
inherits = "release"
debug = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
minijinja = "2"
minify-html = "0.18.1"
plist = "1"
pagefind = { version = "1.5.2", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "macros", "sync", "io-util"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
indexmap = { version = "2.13.0", features = ["serde"] }
indicatif = "0.18"
mimalloc = "0.1"
tempfile = "3"
notify = "8"
notify-debouncer-full = "0.7"
ctrlc = "3"
tiny_http = "0.12"
mime_guess = "2"
ureq = "2"
quick-xml = "0.39.4"
