{%- set loc = config.cap_location | default("bottom") -%}
{%- if loc == "bottom" %}
<div class="table-div" id="{{config.id}}">
{{calepin.children}}
{%- if config.caption %}
<p class="table-caption">{{config.caption}}</p>
{%- endif %}
</div>
{%- else %}
<div class="table-div" id="{{config.id}}">
{%- if config.caption %}
<p class="table-caption">{{config.caption}}</p>
{%- endif %}
{{calepin.children}}
</div>
{%- endif %}
