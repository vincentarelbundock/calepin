name = "tailwind"
description = "HTML document output styled with Tailwind CSS utility classes"

[target]
writer = "html"
template = "page"
extension = "html"
fig_extension = "svg"
fig_formats = ["svg", "png", "jpg", "webp", "gif"]
preview = "serve"
crossref = "html"
modules = ["highlight", "append_footnotes", "embed_images"]
