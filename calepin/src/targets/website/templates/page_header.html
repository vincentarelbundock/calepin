{% if clp.title or clp.subtitle or clp.date or clp.abstract %}
<header class="page-header">
  {% if clp.title %}<h1>{{ clp.title }}</h1>{% endif %}
  {% if clp.subtitle %}<p class="subtitle">{{ clp.subtitle }}</p>{% endif %}
  {% if clp.date %}<p class="date">{{ clp.date }}</p>{% endif %}
  {% if clp.abstract %}<div class="abstract">{{ clp.abstract }}</div>{% endif %}
</header>
{% endif %}
