{% if cfg.colors %}
<div class="relative">
<button class="flex items-center justify-center p-1.5 text-muted rounded-md hover:bg-hover bg-transparent border-none cursor-pointer" id="colors-picker" aria-label="Switch color scheme">
  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="0.5" fill="currentColor"/><circle cx="17.5" cy="10.5" r="0.5" fill="currentColor"/><circle cx="8.5" cy="7.5" r="0.5" fill="currentColor"/><circle cx="6.5" cy="12" r="0.5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.1-.7-.4-1-.3-.3-.4-.7-.4-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-5.5-4.5-10-10-10z"/></svg>
</button>
<div id="colors-menu" class="absolute right-0 top-full mt-1 bg-page border border-brd rounded-lg shadow-lg py-1 z-50 min-w-[8rem]" style="display:none">
  {% for t in cfg.colors %}<button class="colors-option block w-full text-left px-3 py-1.5 text-sm hover:bg-hover border-none bg-transparent cursor-pointer text-[color:var(--c-text)]" data-colors="{% if not loop.first %}{{ t }}{% endif %}" data-colors-file="{% if not loop.first %}{{ link('assets/themes/' ~ t ~ '.css') }}{% endif %}" data-highlight-file="{% if not loop.first %}{{ link('assets/themes/' ~ t ~ '-highlight.css') }}{% endif %}">{{ t | replace("catppuccin-", "") | replace("-", " ") | title }}</button>
  {% endfor %}
</div>
</div>
{% endif %}
