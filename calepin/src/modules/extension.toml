name = "core"
description = "Built-in modules"

# -- Span transforms --

[[modules]]
name = "pagebreak"
kind = "span"
contexts = ["span"]

[modules.match]
classes = ["pagebreak"]

[[modules]]
name = "video"
kind = "span"
contexts = ["span"]

[modules.match]
classes = ["video"]

[[modules]]
name = "placeholder"
kind = "span"
contexts = ["span"]

[modules.match]
classes = ["placeholder"]

[[modules]]
name = "lorem"
kind = "span"
contexts = ["span"]

[modules.match]
classes = ["lorem"]

# -- Element children transforms --

[[modules]]
name = "document_listing"
kind = "element_children"
contexts = ["div"]

[modules.match]
classes = ["listing"]
writers = ["html"]

[[modules]]
name = "tabset"
kind = "element_children"
contexts = ["div"]

[modules.match]
classes = ["panel-tabset"]
writers = ["html"]

[[modules]]
name = "layout"
kind = "element_children"
contexts = ["div"]

[modules.match]
attrs = ["layout_ncol", "layout_nrow", "layout"]

[[modules]]
name = "figure"
kind = "element_children"
contexts = ["div"]

[modules.match]
id_prefix = "fig-"

[[modules]]
name = "table"
kind = "element_children"
contexts = ["div"]

[modules.match]
id_prefix = "tbl-"

[[modules]]
name = "theorem"
kind = "element_children"
contexts = ["div"]

[modules.match]
classes = [
    "theorem", "lemma", "corollary", "proposition", "conjecture",
    "definition", "example", "exercise", "solution", "remark",
    "algorithm", "proof",
]

# -- Element transforms --

[[modules]]
name = "convert_svg_pdf"
kind = "element"

# -- Document transforms --

[[modules]]
name = "append_footnotes"
kind = "document"

[[modules]]
name = "split_slides"
kind = "document"

[[modules]]
name = "highlight"
kind = "document"

[[modules]]
name = "embed_images"
kind = "document"
