# Document-level defaults (single-file rendering).
# Concatenated with shared.toml at load time.

# -- Document targets --
[targets.html]
writer = "html"
template = "main"
extension = "html"
fig_extension = "svg"
fig_formats = ["svg", "png", "jpg", "webp", "gif"]
preview = "serve"
modules = ["highlight", "append_footnotes", "embed_images"]
crossref = "html"

[targets.latex]
writer = "latex"
template = "main"
extension = "tex"
fig_extension = "pdf"
fig_formats = ["pdf", "eps", "svg", "png", "jpg"]
preview = "serve"
modules = ["highlight", "convert_svg_pdf"]
crossref = "latex"
toc_headings = false

[targets.typst]
writer = "typst"
template = "main"
extension = "typ"
fig_extension = "svg"
fig_formats = ["svg", "png", "jpg"]
preview = "serve"
modules = ["highlight"]
crossref = "plain"

[targets.markdown]
writer = "markdown"
extension = "md"
fig_extension = "png"
preview = "none"
modules = ["highlight"]
crossref = "plain"
