# Collection-level defaults (multi-file site/book builds).
# Concatenated with shared.toml at load time.

global_crossref = false
preview_port = 3456

# -- Collection targets --
[targets.website]
writer = "html"
template = "main"
extension = "html"
fig_extension = "svg"
standalone = false
preview = "serve"

[targets.book]
writer = "typst"
template = "chapter"
extension = "pdf"
fig_extension = "svg"
post = ["typst compile {input}"]

[targets.book-latex]
writer = "latex"
template = "chapter"
extension = "pdf"
fig_extension = "pdf"
post = ["latexmk -pdf -interaction=nonstopmode {input}"]
