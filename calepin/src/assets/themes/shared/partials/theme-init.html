    <meta name="color-scheme" content="light dark">
    {# Discover the generated theme-init URL from rendered context and load it as an external asset. #}
    {% for script in site.scripts %}
      {% if "theme-init.js" in script %}
    <script
      src="{{ script }}"
      data-calepin-theme-storage-key="{{ calepin_theme_storage_key | default("calepin-website-theme") }}"
      data-calepin-theme-param="{{ calepin_theme_param | default("theme") }}"></script>
      {% endif %}
    {% endfor %}
