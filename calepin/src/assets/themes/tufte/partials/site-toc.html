        {% if site.toc %}
        <aside class="tufte-toc">
            <p class="tufte-toc-title">On this page</p>
            <nav aria-label="On this page">
                <ol>
                    {% for item in site.toc %}
                    <li class="level-{{ item.level }}"><a href="{{ item.href }}">{{ item.label }}</a></li>
                    {% endfor %}
                </ol>
            </nav>
        </aside>
        {% endif %}
