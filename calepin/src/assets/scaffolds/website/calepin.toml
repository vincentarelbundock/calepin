title = "Example Site"
description = "A bilingual Calepin website scaffold with pages, posts, and theme-friendly content."
# base_url = "https://example.com"
# Try the bundled themes:
# theme = "calepin"
# theme = "academic"
# theme = "tufte"
theme = "calepin"

pdf = true
default_language = "en"

# Uncomment to generate static search if Pagefind is available.
# search = "pagefind"

# Uncomment feeds after setting base_url.
# generate_feeds = true
# [feeds]
# filenames = ["atom.xml", "rss.xml"]

[languages.en]
label = "English"
content_dir = "."

[languages.fr]
label = "Français"
content_dir = "fr"

[static]
include = ["assets/**"]

[pages]
include = ["posts/*.typ"]

[navbar]

[[navbar.item]]
position = "left"
target = "about.typ"
label = "About"

[[navbar.item]]
position = "left"
target = "blog.typ"
label = "Blog"

[[navbar.item]]
position = "right"
target = "https://github.com/user/project"
label = "{icon:github} Source"

[sidebar]
fold = false

[[sidebar.section]]
title = "Start"

  [[sidebar.section.item]]
  target = "index.typ"
  icon = "home"

  [[sidebar.section.item]]
  target = "about.typ"

[[sidebar.section]]
title = "Guide"

  [[sidebar.section.item]]
  target = "guide/features.typ"

  [[sidebar.section.item]]
  target = "guide/writing.typ"

[[sidebar.section]]
title = "Publishing"

  [[sidebar.section.item]]
  target = "blog.typ"
